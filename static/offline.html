<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Relay</title>
  <meta name="theme-color" content="#070b14">
  <link rel="icon" type="image/png" href="/static/new%20logo.png">
  <link rel="stylesheet" href="/static/css/style.css?v=2.2">
  <style>
    .offline-box {
      max-width: 480px;
      margin: 80px auto;
      text-align: center;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <a href="/" class="brand">
      <div class="brand-icon">
        <img src="/static/new%20logo.png" alt="Relay Logo" class="brand-logo-img">
      </div>
      <span class="brand-title">Relay</span>
    </a>
  </header>

  <div class="offline-box">
    <div class="glass-card">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2" style="margin-bottom: 16px;">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
      <h2 style="font-weight: 800; margin-bottom: 8px;">Network Disconnected</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;">
        You are currently offline. Please reconnect to the same local Wi-Fi network as the sender host.
      </p>
      <button onclick="window.location.reload()" class="btn btn-primary" style="width: 100%;">
        Retry Connection
      </button>
    </div>
  </div>
</body>
</html>
