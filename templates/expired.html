<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Session Expired - Relay</title>
  <meta name="theme-color" content="#070b14">
  <link rel="icon" type="image/png" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/css/style.css?v=2.1">
  <style>
    .expired-container {
      max-width: 520px;
      margin: 80px auto;
      text-align: center;
      padding: 0 20px;
    }
    .expired-icon {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.25);
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .expired-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 30%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .expired-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .security-note {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--surface-card-border);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <a href="/" class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
      </div>
      <div>
        <span class="brand-title">Relay</span>
      </div>
    </a>
  </header>

  <div class="expired-container">
    <div class="glass-card">
      <div class="expired-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>
      
      <h1 class="expired-title">Transfer Expired</h1>
      <p class="expired-desc">
        This transfer session is no longer active. To protect your privacy, all temporary session files have been securely wiped from the host machine.
      </p>

      <a href="/" class="btn btn-primary" style="width: 100%; padding: 12px 20px; font-size: 1rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Start New Transfer
      </a>

      <p class="security-note">
        Sessions automatically expire after the configured timeout or when the sender manually ends the transfer.
      </p>
    </div>
  </div>

</body>
</html>
